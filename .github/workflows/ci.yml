name: Build Farsi Caption Premium

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FarsiCaptionPremium-v3.0-ultra-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Premium v3.0 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FarsiCaptionPremium-v3.0-ultra.apk
          if gh release view v3.0-ultra >/dev/null 2>&1; then
            gh release upload v3.0-ultra FarsiCaptionPremium-v3.0-ultra.apk --clobber
          else
            gh release create v3.0-ultra FarsiCaptionPremium-v3.0-ultra.apk --target "$GITHUB_SHA" --title "FarsiCaptionPremium v3.0 Offline Premium" --notes "Deep Persian-first offline Auto Caption with self-learning corrections, Persian normalization, improved word timing, progressive word-by-word export, direct caption positioning, and premium style controls."
          fi
