name: Build Farsi Caption Premium

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FarsiCaptionPremium-v2.2-custom-style-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Premium v2.2 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FarsiCaptionPremium-v2.2-custom-style.apk
          if gh release view v2.2-custom-style >/dev/null 2>&1; then
            gh release upload v2.2-custom-style FarsiCaptionPremium-v2.2-custom-style.apk --clobber
          else
            gh release create v2.2-custom-style FarsiCaptionPremium-v2.2-custom-style.apk --target "$GITHUB_SHA" --title "FarsiCaptionPremium v2.2 Offline Premium" --notes "Offline Persian Auto Caption with editable font size, text color, caption background, Persian spacing normalization, no Backend URL and no App Token."
          fi
